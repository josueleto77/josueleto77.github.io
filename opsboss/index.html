<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsBoss</title>
<meta name="description" content="OpsBoss — CRM y gestión de operaciones para empresas de Solar, Roofing y HVAC.">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 22V10h6.5a4 4 0 0 1 0 8H12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='21' r='3' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">O<span></span></div>
      <div><div class="brand-name">OpsBoss</div><div class="brand-sub">Solar · Roofing · HVAC</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost sm full" id="themeBtn">◐ Tema</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menú">☰</button>
      <button class="search" id="searchBtn"><span>⌕</span> Buscar clientes, trabajos, facturas… <kbd>Ctrl K</kbd></button>
      <div class="division-filter" id="divFilter"></div>
      <div class="new-wrap">
        <button class="btn primary" id="newBtn">＋ Nuevo</button>
        <div class="dropdown" id="newMenu">
          <button data-new="lead">Lead</button>
          <button data-new="customer">Cliente</button>
          <button data-new="estimate">Estimado</button>
          <button data-new="job">Trabajo</button>
          <button data-new="invoice">Factura</button>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="app.js"></script>
</body>
</html>
