<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traildriv — Find Your Next Adventure Nearby</title>
<meta name="description" content="Traildriv finds playgrounds, hiking trails, fishing spots, bike trails, lakes, restaurants, dance clubs and massage/spa places near you, with the details that matter: restrooms, picnic areas, shade, fees, difficulty and more.">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

<div class="app-shell">

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="brand">
      <img src="img/logo.svg" alt="Traildriv" class="brand-logo">
    </div>

    <form class="search-form" id="searchForm" role="search">
      <input type="text" id="searchInput" placeholder="Search a city, address or place…" autocomplete="off">
      <button type="submit" aria-label="Search location">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
      </button>
    </form>

    <div class="header-actions">
      <label class="radius-select">
        Radius
        <select id="radiusSelect">
          <option value="3000">3 km</option>
          <option value="8000" selected>8 km</option>
          <option value="20000">20 km</option>
          <option value="50000">50 km</option>
        </select>
      </label>
      <button id="locateBtn" class="btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 8a4 4 0 1 0 4 4 4 4 0 0 0-4-4m9-1h-2.06A7 7 0 0 0 13 1.06V-1h-2v2.06A7 7 0 0 0 5.06 7H3v2h2.06A7 7 0 0 0 11 16.94V19h2v-2.06A7 7 0 0 0 18.94 11H21ZM12 17a5 5 0 1 1 5-5 5 5 0 0 1-5 5"/></svg>
        Use my location
      </button>
    </div>
  </header>

  <!-- ===== Category bar ===== -->
  <nav class="category-bar" id="categoryBar" aria-label="Categories">
    <button class="cat-all" id="catAllBtn" data-active="false">All</button>
    <!-- category chips injected by JS -->
  </nav>

  <!-- ===== Status strip ===== -->
  <div id="statusStrip" class="status-strip" hidden></div>

  <!-- ===== Main ===== -->
  <main class="app-main">
    <section class="results-pane">
      <div class="results-toolbar">
        <span id="resultsCount">Waiting for your location…</span>
        <div class="results-toolbar-actions">
          <label class="sort-select">
            Sort
            <select id="sortSelect">
              <option value="distance">Nearest</option>
              <option value="name">Name (A–Z)</option>
            </select>
          </label>
          <button id="favoritesToggle" class="chip-toggle" aria-pressed="false">★ Favorites</button>
        </div>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>

    <section class="map-pane">
      <div id="map"></div>
    </section>

    <!-- ===== Detail drawer: a real layout column on desktop (shrinks the map,
         never covers it), a full-screen sheet on mobile — see CSS. ===== -->
    <aside id="detailDrawer" class="detail-drawer" hidden aria-hidden="true">
      <button id="detailClose" class="detail-close" aria-label="Close">&times;</button>
      <div id="detailContent"></div>
    </aside>
  </main>

</div>

<!-- Mobile-only dimmed backdrop behind the full-screen detail sheet -->
<div id="detailOverlay" class="detail-overlay" hidden></div>

<template id="factTemplate">
  <div class="fact">
    <span class="fact-icon"></span>
    <div class="fact-body">
      <span class="fact-label"></span>
      <span class="fact-value"></span>
    </div>
  </div>
</template>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/config.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
